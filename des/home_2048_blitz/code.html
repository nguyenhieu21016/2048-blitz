<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #faf8ef;
        }

<body class="bg-page-bg text-on-surface selection:bg-primary/20">
<!-- TopAppBar -->
<header class="bg-stone-50 dark:bg-stone-950 border-b-0 sticky top-0 z-50">
<div class="flex justify-between items-center h-16 px-6 max-w-7xl mx-auto">
<div class="text-2xl font-black text-[#8f7a66] dark:text-[#a69380] font-['Plus_Jakarta_Sans'] tracking-tight">
                2048 Blitz
            </div>
<nav class="hidden md:flex gap-8 items-center font-['Plus_Jakarta_Sans'] font-semibold tracking-tight text-stone-600 dark:text-stone-400">
<a class="text-stone-500 dark:text-stone-500 hover:text-stone-800 dark:hover:text-stone-200 transition-colors duration-200" href="#">Classic</a>
<a class="text-stone-500 dark:text-stone-500 hover:text-stone-800 dark:hover:text-stone-200 transition-colors duration-200" href="#">Blitz</a>
<a class="text-stone-500 dark:text-stone-500 hover:text-stone-800 dark:hover:text-stone-200 transition-colors duration-200" href="#">Leaderboard</a>
<a class="text-stone-500 dark:text-stone-500 hover:text-stone-800 dark:hover:text-stone-200 transition-colors duration-200" href="#">Settings</a>
</nav>
<div class="flex items-center gap-4">
<button class="p-2 rounded-full hover:bg-stone-200/50 dark:hover:bg-stone-800/50 transition-colors duration-200 scale-95 active:scale-90 transition-transform">
<span class="material-symbols-outlined text-stone-600 dark:text-stone-400">account_circle</span>
</button>
</div>
</div>
</header>
<main class="min-h-[calc(100vh-128px)] flex flex-col items-center justify-center px-6 py-margin-body-mobile md:py-margin-body-desktop">
<!-- Hero Section -->
<div class="text-center mb-12 space-y-4">
<h1 class="font-game-title text-game-title-mobile md:text-game-title text-[#8f7a66] tracking-tight">
                2048 Blitz
            </h1>
<p class="font-body-base text-body-mobile md:text-body-base text-text-primary max-w-lg mx-auto">
                The definitive tactical puzzle experience. Master the grid in classic mode or race against the clock in blitz mode.
            </p>
</div>
<!-- Mode Selection Grid -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-6 w-full max-w-3xl mb-12">
<!-- Classic Mode Card -->
<button class="group relative overflow-hidden bg-tile-base rounded-xl p-8 flex flex-col items-center text-center transition-all duration-300 hover:-translate-y-1 hover:shadow-xl hover:shadow-primary/5 active:scale-95">
<div class="w-16 h-16 bg-container-bg rounded-lg flex items-center justify-center mb-6 text-text-bright">
<span class="material-symbols-outlined text-4xl">grid_4x4</span>
</div>
<h3 class="text-score-value font-score-value text-text-primary mb-2">Classic</h3>
<p class="text-score-label font-score-label text-text-primary/70 uppercase">Endless Puzzle Strategy</p>
<div class="mt-6 px-6 py-2 bg-primary text-text-bright rounded-lg font-bold transition-colors group-hover:bg-[#8f7a66]">
                    Play Classic
                </div>
</button>
<!-- Blitz Mode Card -->
<button class="group relative overflow-hidden bg-secondary-fixed rounded-xl p-8 flex flex-col items-center text-center transition-all duration-300 hover:-translate-y-1 hover:shadow-xl hover:shadow-secondary/10 active:scale-95">
<div class="w-16 h-16 bg-on-secondary-fixed-variant rounded-lg flex items-center justify-center mb-6 text-text-bright">
<span class="material-symbols-outlined text-4xl">bolt</span>
</div>
<h3 class="text-score-value font-score-value text-on-secondary-fixed-variant mb-2">Blitz</h3>
<p class="text-score-label font-score-label text-on-secondary-fixed-variant/70 uppercase">High-Speed Challenge</p>
<div class="mt-6 px-6 py-2 bg-secondary text-text-bright rounded-lg font-bold transition-colors group-hover:bg-on-secondary-fixed-variant">
                    Start Blitz
                </div>
</button>
</div>
<!-- Secondary Actions Bento -->
<div class="flex flex-wrap justify-center gap-4 w-full max-w-3xl">
<button class="flex items-center gap-2 px-6 py-3 bg-stone-200 dark:bg-stone-800 rounded-full text-stone-700 dark:text-stone-300 font-bold transition-all hover:bg-stone-300 dark:hover:bg-stone-700 active:scale-95">
<span class="material-symbols-outlined">leaderboard</span>
                Leaderboard
            </button>
<button class="flex items-center gap-2 px-6 py-3 bg-stone-200 dark:bg-stone-800 rounded-full text-stone-700 dark:text-stone-300 font-bold transition-all hover:bg-stone-300 dark:hover:bg-stone-700 active:scale-95">
<span class="material-symbols-outlined">settings</span>
                Settings
            </button>
<button class="flex items-center gap-2 px-6 py-3 bg-stone-200 dark:bg-stone-800 rounded-full text-stone-700 dark:text-stone-300 font-bold transition-all hover:bg-stone-300 dark:hover:bg-stone-700 active:scale-95">
<span class="material-symbols-outlined">help</span>
                How to Play
            </button>
</div>
<!-- Decorative Board Preview -->
<div class="mt-20 opacity-20 pointer-events-none select-none hidden lg:block">
<div class="grid grid-cols-4 gap-4 p-4 bg-container-bg rounded-xl">
<div class="w-16 h-16 bg-tile-base rounded-lg flex items-center justify-center text-text-primary font-bold">2</div>
<div class="w-16 h-16 bg-surface-variant rounded-lg flex items-center justify-center text-text-primary font-bold">4</div>
<div class="w-16 h-16 bg-tile-8 rounded-lg flex items-center justify-center text-text-bright font-bold">8</div>
<div class="w-16 h-16 bg-tile-base rounded-lg flex items-center justify-center text-text-primary font-bold">2</div>
<div class="w-16 h-16 bg-tile-16 rounded-lg flex items-center justify-center text-text-bright font-bold">16</div>
<div class="w-16 h-16 bg-tile-32 rounded-lg flex items-center justify-center text-text-bright font-bold">32</div>
<div class="w-16 h-16 bg-tile-gold rounded-lg flex items-center justify-center text-text-bright font-bold">2048</div>
<div class="w-16 h-16 bg-tile-64 rounded-lg flex items-center justify-center text-text-bright font-bold">64</div>
</div>
</div>
</main>
<!-- Footer -->
<footer class="bg-stone-50 dark:bg-stone-950 border-t border-stone-200 dark:border-stone-800 py-8">
<div class="flex flex-col md:flex-row justify-between items-center px-6 max-w-7xl mx-auto gap-4">
<div class="text-sm font-bold text-stone-400 uppercase tracking-widest font-['Plus_Jakarta_Sans']">
                2048 Blitz
            </div>
<div class="text-stone-500 dark:text-stone-500 text-xs uppercase tracking-widest font-['Plus_Jakarta_Sans'] text-center">
                © 2024 2048 Blitz. Tactile Precision Gaming.
            </div>
<nav class="flex gap-6">
<a class="text-stone-400 hover:text-stone-600 transition-all hover:underline text-xs uppercase tracking-widest font-['Plus_Jakarta_Sans']" href="#">How to Play</a>
<a class="text-stone-400 hover:text-stone-600 transition-all hover:underline text-xs uppercase tracking-widest font-['Plus_Jakarta_Sans']" href="#">Privacy</a>
<a class="text-stone-400 hover:text-stone-600 transition-all hover:underline text-xs uppercase tracking-widest font-['Plus_Jakarta_Sans']" href="#">Terms</a>
</nav>
</div>
</footer>
</body></html>
