<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #1c1917;
        }
    </style>
</head>
<body class="bg-page-bg text-on-surface selection:bg-primary/40">
<!-- TopAppBar -->
<header class="bg-stone-900/50 border-b border-stone-800 sticky top-0 z-50 backdrop-blur-md">
<div class="flex justify-between items-center h-16 px-6 max-w-7xl mx-auto">
<div class="text-2xl font-black text-[#a69380] font-['Plus_Jakarta_Sans'] tracking-tight">
            2048 Blitz
        </div>
<nav class="hidden md:flex gap-8 items-center font-['Plus_Jakarta_Sans'] font-semibold tracking-tight text-stone-400">
<a class="text-stone-300 hover:text-white transition-colors duration-200" href="#">Classic</a>
<a class="text-stone-300 hover:text-white transition-colors duration-200" href="#">Blitz</a>
<a class="text-stone-300 hover:text-white transition-colors duration-200" href="#">Leaderboard</a>
<a class="text-stone-300 hover:text-white transition-colors duration-200" href="#">Settings</a>
</nav>
<div class="flex items-center gap-4">
<button class="p-2 rounded-full hover:bg-stone-800 transition-colors duration-200 scale-95 active:scale-90 transition-transform">
<span class="material-symbols-outlined text-stone-400">account_circle</span>
</button>
</div>
</div>
</header>
<main class="min-h-[calc(100vh-128px)] flex flex-col items-center justify-center px-6 py-margin-body-mobile md:py-margin-body-desktop">
<!-- Hero Section -->
<div class="text-center mb-12 space-y-4">
<h1 class="font-game-title text-game-title-mobile md:text-game-title text-[#a69380] tracking-tight">
            2048 Blitz
        </h1>
<p class="font-body-base text-body-mobile md:text-body-base text-stone-400 max-w-lg mx-auto">
            The definitive tactical puzzle experience. Master the grid in classic mode or race against the clock in blitz mode.
        </p>
</div>
<!-- Mode Selection Grid -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-6 w-full max-w-3xl mb-12">
<!-- Classic Mode Card -->
<button class="group relative overflow-hidden bg-stone-800/50 border border-stone-700/50 rounded-xl p-8 flex flex-col items-center text-center transition-all duration-300 hover:-translate-y-1 hover:bg-stone-800 hover:shadow-2xl hover:shadow-black/20 active:scale-95">
<div class="w-16 h-16 bg-stone-700 rounded-lg flex items-center justify-center mb-6 text-stone-200">
<span class="material-symbols-outlined text-4xl">grid_4x4</span>
</div>
<h3 class="text-score-value font-score-value text-stone-100 mb-2">Classic</h3>
<p class="text-score-label font-score-label text-stone-400 uppercase">Endless Puzzle Strategy</p>
<div class="mt-6 px-6 py-2 bg-[#8f7a66] text-white rounded-lg font-bold transition-all group-hover:bg-[#a69380] group-hover:scale-105">
                Play Classic
            </div>
</button>
<!-- Blitz Mode Card -->
<button class="group relative overflow-hidden bg-stone-800/50 border border-stone-700/50 rounded-xl p-8 flex flex-col items-center text-center transition-all duration-300 hover:-translate-y-1 hover:bg-stone-800 hover:shadow-2xl hover:shadow-black/20 active:scale-95">
<div class="w-16 h-16 bg-yellow-500/20 border border-yellow-500/30 rounded-lg flex items-center justify-center mb-6 text-yellow-500">
<span class="material-symbols-outlined text-4xl">bolt</span>
</div>
<h3 class="text-score-value font-score-value text-stone-100 mb-2">Blitz</h3>
<p class="text-score-label font-score-label text-stone-400 uppercase">High-Speed Challenge</p>
<div class="mt-6 px-6 py-2 bg-yellow-600 text-stone-900 rounded-lg font-bold transition-all group-hover:bg-yellow-500 group-hover:scale-105">
                Start Blitz
            </div>
</button>
</div>
<!-- Secondary Actions Bento -->
<div class="flex flex-wrap justify-center gap-4 w-full max-w-3xl">
<button class="flex items-center gap-2 px-6 py-3 bg-stone-800/80 border border-stone-700/50 rounded-full text-stone-300 font-bold transition-all hover:bg-stone-700 hover:text-white active:scale-95">
<span class="material-symbols-outlined">leaderboard</span>
            Leaderboard
        </button>
<button class="flex items-center gap-2 px-6 py-3 bg-stone-800/80 border border-stone-700/50 rounded-full text-stone-300 font-bold transition-all hover:bg-stone-700 hover:text-white active:scale-95">
<span class="material-symbols-outlined">settings</span>
            Settings
        </button>
<button class="flex items-center gap-2 px-6 py-3 bg-stone-800/80 border border-stone-700/50 rounded-full text-stone-300 font-bold transition-all hover:bg-stone-700 hover:text-white active:scale-95">
<span class="material-symbols-outlined">help</span>
            How to Play
        </button>
</div>
<!-- Decorative Board Preview -->
<div class="mt-20 opacity-10 pointer-events-none select-none hidden lg:block grayscale">
<div class="grid grid-cols-4 gap-4 p-4 bg-stone-800 rounded-xl">
<div class="w-16 h-16 bg-stone-700 rounded-lg flex items-center justify-center text-stone-300 font-bold">2</div>
<div class="w-16 h-16 bg-stone-600 rounded-lg flex items-center justify-center text-stone-300 font-bold">4</div>
<div class="w-16 h-16 bg-stone-500 rounded-lg flex items-center justify-center text-white font-bold">8</div>
<div class="w-16 h-16 bg-stone-700 rounded-lg flex items-center justify-center text-stone-300 font-bold">2</div>
<div class="w-16 h-16 bg-stone-400 rounded-lg flex items-center justify-center text-white font-bold">16</div>
<div class="w-16 h-16 bg-stone-300 rounded-lg flex items-center justify-center text-stone-900 font-bold">32</div>
<div class="w-16 h-16 bg-yellow-500 rounded-lg flex items-center justify-center text-stone-900 font-bold">2048</div>
<div class="w-16 h-16 bg-red-600 rounded-lg flex items-center justify-center text-white font-bold">64</div>
</div>
</div>
</main>
<!-- Footer -->
<footer class="bg-stone-900/80 border-t border-stone-800 py-8 mt-12">
<div class="flex flex-col md:flex-row justify-between items-center px-6 max-w-7xl mx-auto gap-4">
<div class="text-sm font-bold text-stone-500 uppercase tracking-widest font-['Plus_Jakarta_Sans']">
            2048 Blitz
        </div>
<div class="text-stone-600 text-xs uppercase tracking-widest font-['Plus_Jakarta_Sans'] text-center">
            © 2024 2048 Blitz. Tactile Precision Gaming.
        </div>
<nav class="flex gap-6">
<a class="text-stone-500 hover:text-stone-300 transition-all hover:underline text-xs uppercase tracking-widest font-['Plus_Jakarta_Sans']" href="#">How to Play</a>
<a class="text-stone-500 hover:text-stone-300 transition-all hover:underline text-xs uppercase tracking-widest font-['Plus_Jakarta_Sans']" href="#">Privacy</a>
<a class="text-stone-500 hover:text-stone-300 transition-all hover:underline text-xs uppercase tracking-widest font-['Plus_Jakarta_Sans']" href="#">Terms</a>
</nav>
</div>
</footer>
</body></html>
