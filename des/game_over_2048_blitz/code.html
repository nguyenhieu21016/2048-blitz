<div class="flex items-center gap-4">

<div>

</div>
<div class="flex gap-2">
<div class="bg-container-bg rounded-lg p-3 text-center min-w-[80px]">

</div>
<div class="bg-container-bg rounded-lg p-3 text-center min-w-[80px]">

</div>

<div class="bg-tile-base opacity-20 rounded-lg"></div>
<div class="bg-tile-base opacity-20 rounded-lg"></div>

</div>
